<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golearn - Learning Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        duo: {
                            green: '#58CC02',
                            greenDark: '#46A302',
                            blue: '#1CB0F6',
                            blueDark: '#1899D6',
                            purple: '#CE82FF',
                            purpleDark: '#A552E6',
                            orange: '#FF9600',
                            yellow: '#FFC800',
                            red: '#FF4B4B',
                        },
                        darkbg: '#0F172A',
                        darkcard: '#1E293B',
                        darkborder: '#334155'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Card Flip Mechanics */
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }

        /* Gamified 3D push down buttons */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0px 4px 0px var(--tw-shadow-color);
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px var(--tw-shadow-color);
        }

        /* Pulse glow animation */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(88, 204, 2, 0.3);
            }

            50% {
                box-shadow: 0 0 25px rgba(88, 204, 2, 0.7);
            }
        }

        .glow-active {
            animation: pulse-glow 2s infinite;
        }


        /* =========================================================
           Golearn visual system - Apple HIG-inspired presentation
           Visual-only layer: preserves existing component structure.
           ========================================================= */
        :root {
            --wl-blue: #007aff;
            --wl-blue-pressed: #006ee6;
            --wl-green: #34c759;
            --wl-red: #ff3b30;
            --wl-orange: #ff9500;
            --wl-yellow: #ffcc00;
            --wl-light-bg: #f2f2f7;
            --wl-light-surface: rgba(255, 255, 255, 0.96);
            --wl-light-grouped: rgba(255, 255, 255, 0.72);
            --wl-light-separator: rgba(60, 60, 67, 0.18);
            --wl-light-label: #1d1d1f;
            --wl-light-secondary: #6e6e73;
            --wl-dark-bg: #000000;
            --wl-dark-surface: rgba(28, 28, 30, 0.96);
            --wl-dark-grouped: rgba(44, 44, 46, 0.86);
            --wl-dark-separator: rgba(84, 84, 88, 0.55);
            --wl-dark-label: #f5f5f7;
            --wl-dark-secondary: #a1a1a6;
            --wl-radius-card: 16px;
            --wl-radius-control: 12px;
            --wl-radius-small: 10px;
        }

        html {
            background: var(--wl-light-bg);
        }

        html.dark {
            background: var(--wl-dark-bg);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif !important;
            background: var(--wl-light-bg) !important;
            color: var(--wl-light-label) !important;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        html.dark body {
            background: var(--wl-dark-bg) !important;
            color: var(--wl-dark-label) !important;
        }

        /* Remove the old playful 3D/glow treatment. */
        .btn-3d,
        .btn-3d:active,
        .glow-active {
            transform: none !important;
            animation: none !important;
            box-shadow: none !important;
        }

        .btn-3d {
            transition: background-color .16s ease, border-color .16s ease, color .16s ease, opacity .16s ease, transform .16s ease !important;
        }

        .btn-3d:active {
            transform: scale(.985) !important;
        }

        /* Apple-like type hierarchy: calmer weights and tighter rhythm. */
        [class~="font-black"] {
            font-weight: 700 !important;
        }

        [class~="font-extrabold"] {
            font-weight: 600 !important;
        }

        [class~="font-bold"] {
            font-weight: 600 !important;
        }

        [class~="uppercase"] {
            letter-spacing: .02em !important;
        }

        /* Native-feeling surfaces and radii. */
        [class~="rounded-3xl"],
        [class~="rounded-2xl"] {
            border-radius: var(--wl-radius-card) !important;
        }

        [class~="rounded-xl"] {
            border-radius: var(--wl-radius-control) !important;
        }

        [class~="rounded-lg"] {
            border-radius: var(--wl-radius-small) !important;
        }

        [class~="shadow-xl"],
        [class~="shadow-2xl"],
        [class~="shadow-lg"],
        [class~="shadow-md"],
        [class~="shadow-sm"] {
            box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .045) !important;
        }

        html.dark [class~="shadow-xl"],
        html.dark [class~="shadow-2xl"],
        html.dark [class~="shadow-lg"],
        html.dark [class~="shadow-md"],
        html.dark [class~="shadow-sm"] {
            box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .22) !important;
        }

        /* Header / toolbar. */
        header.sticky {
            background: rgba(255, 255, 255, .86) !important;
            border-bottom-color: var(--wl-light-separator) !important;
            backdrop-filter: saturate(180%) blur(20px) !important;
            -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
        }

        html.dark header.sticky {
            background: rgba(0, 0, 0, .78) !important;
            border-bottom-color: var(--wl-dark-separator) !important;
        }

        /* Desktop segmented navigation stays in place; make it quieter and native-looking. */
        header nav {
            background: rgba(118, 118, 128, .12) !important;
            border: 0 !important;
            border-radius: 10px !important;
            padding: 2px !important;
        }

        header nav button {
            min-height: 36px;
            border-radius: 8px !important;
            color: #6e6e73 !important;
            box-shadow: none !important;
            font-size: 13px !important;
            font-weight: 500 !important;
        }

        header nav button:hover {
            background: rgba(118, 118, 128, .09) !important;
        }

        header nav button[class*="bg-white"],
        header nav button[class*="dark:bg-slate-700"] {
            background: rgba(255, 255, 255, .94) !important;
            color: var(--wl-blue) !important;
            border: 0 !important;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .10) !important;
        }

        html.dark header nav button[class*="bg-white"],
        html.dark header nav button[class*="dark:bg-slate-700"] {
            background: rgba(99, 99, 102, .38) !important;
            color: #f5f5f7 !important;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .35) !important;
        }

        /* Appearance control. */
        header button[title="Toggle Dark Mode"] {
            min-width: 36px;
            min-height: 36px;
            border-radius: 10px !important;
            background: rgba(118, 118, 128, .12) !important;
            color: #3a3a3c !important;
            border: 0 !important;
        }

        html.dark header button[title="Toggle Dark Mode"] {
            background: rgba(118, 118, 128, .20) !important;
            color: #f5f5f7 !important;
        }

        /* Bottom tab bar on smaller screens. */
        @media (max-width: 767px) {

            .mobile-bottom-nav,
            header .md\:hidden {
                background: rgba(249, 249, 251, .92) !important;
                border-top-color: var(--wl-light-separator) !important;
                padding-bottom: max(8px, env(safe-area-inset-bottom)) !important;
                backdrop-filter: saturate(180%) blur(20px) !important;
                -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
            }

            html.dark .mobile-bottom-nav,
            html.dark header .md\:hidden {
                background: rgba(28, 28, 30, .92) !important;
                border-top-color: var(--wl-dark-separator) !important;
            }

            .mobile-bottom-nav button,
            header .md\:hidden button {
                min-width: 44px;
                min-height: 44px;
                border-radius: 10px !important;
                font-weight: 500 !important;
            }

            .mobile-bottom-nav button[class*="bg-emerald-50"],
            header .md\:hidden button[class*="bg-emerald-50"] {
                background: rgba(0, 122, 255, .10) !important;
                color: var(--wl-blue) !important;
            }
        }

        /* Content layer: neutral surfaces and one restrained accent. */
        [class~="bg-slate-50"] {
            background: var(--wl-light-bg) !important;
        }

        [class~="dark:bg-\[#0B0F17\]"] {
            background: var(--wl-dark-bg) !important;
        }

        [class~="bg-white"] {
            background: var(--wl-light-surface) !important;
        }

        [class~="dark:bg-slate-900"] {
            background: var(--wl-dark-surface) !important;
        }

        [class~="dark:bg-slate-950"] {
            background: #000000 !important;
        }

        [class~="bg-slate-100"] {
            background: rgba(118, 118, 128, .10) !important;
        }

        [class~="dark:bg-slate-800"] {
            background: rgba(118, 118, 128, .18) !important;
        }

        [class~="bg-slate-50"] {
            border-color: var(--wl-light-separator);
        }

        /* Borders become separators instead of decorative outlines. */
        [class*="border-slate-200"],
        [class*="border-slate-100"] {
            border-color: var(--wl-light-separator) !important;
        }

        html.dark [class*="border-slate-800"],
        html.dark [class*="border-slate-700"] {
            border-color: var(--wl-dark-separator) !important;
        }

        /* Neutralize the rainbow of old brand utilities. */
        [class~="bg-duo-green"],
        [class~="bg-duo-green"]:hover {
            background: var(--wl-blue) !important;
        }

        [class~="bg-duo-blue"] {
            background: var(--wl-blue) !important;
        }

        [class~="text-duo-green"],
        [class~="text-emerald-600"],
        [class~="text-emerald-500"] {
            color: var(--wl-blue) !important;
        }

        [class~="text-duo-blue"] {
            color: var(--wl-blue) !important;
        }

        [class~="border-duo-green"],
        [class~="border-emerald-500"] {
            border-color: var(--wl-blue) !important;
        }

        [class~="bg-emerald-50"] {
            background: rgba(0, 122, 255, .08) !important;
        }

        [class~="bg-emerald-100"] {
            background: rgba(0, 122, 255, .10) !important;
        }

        [class~="dark:bg-emerald-950\/20"],
        [class~="dark:bg-emerald-950\/40"] {
            background: rgba(10, 132, 255, .14) !important;
        }

        [class~="bg-duo-green\/10"],
        [class~="bg-duo-blue\/10"] {
            background: rgba(0, 122, 255, .10) !important;
        }

        [class~="bg-duo-green\/20"],
        [class~="bg-duo-blue\/20"] {
            background: rgba(0, 122, 255, .14) !important;
        }

        /* Primary actions: one clear accent, no fake depth. */
        button[class*="bg-duo-green"],
        button[class*="bg-duo-blue"],
        button[class*="bg-emerald-500"],
        button[class*="bg-sky-"] {
            background: var(--wl-blue) !important;
            color: #fff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        button[class*="bg-duo-green"]:hover,
        button[class*="bg-duo-blue"]:hover,
        button[class*="bg-emerald-500"]:hover,
        button[class*="bg-sky-"]:hover {
            background: var(--wl-blue-pressed) !important;
        }

        button[class*="bg-slate-900"] {
            background: #1d1d1f !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        html.dark button[class*="bg-slate-900"] {
            background: #f5f5f7 !important;
            color: #1d1d1f !important;
        }

        /* Cards: flatter, quieter, content-first. */
        [class*="rounded-3xl"][class*="border"],
        [class*="rounded-2xl"][class*="border"] {
            box-shadow: 0 1px 2px rgba(0, 0, 0, .03) !important;
        }

        [class*="scale-\[1\.02\]"] {
            transform: none !important;
        }

        [class*="hover:shadow"]:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, .08) !important;
        }

        [class*="group-hover:translate-x-1"] {
            transform: none !important;
        }

        /* Form controls. */
        input,
        textarea,
        select {
            font-family: inherit !important;
            border-radius: 12px !important;
            border-color: var(--wl-light-separator) !important;
            background: rgba(118, 118, 128, .08) !important;
            box-shadow: none !important;
        }

        html.dark input,
        html.dark textarea,
        html.dark select {
            border-color: var(--wl-dark-separator) !important;
            background: rgba(118, 118, 128, .16) !important;
            color: var(--wl-dark-label) !important;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none !important;
            border-color: rgba(0, 122, 255, .7) !important;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, .16) !important;
        }

        /* Modal presentation. */
        [class*="fixed"][class*="bg-slate-900\/"].backdrop-blur-sm {
            background: rgba(0, 0, 0, .42) !important;
            backdrop-filter: blur(8px) saturate(120%) !important;
            -webkit-backdrop-filter: blur(8px) saturate(120%) !important;
        }

        html.dark [class*="fixed"][class*="bg-slate-900\/"].backdrop-blur-sm {
            background: rgba(0, 0, 0, .58) !important;
        }

        /* Progress / status indicators. */
        [class~="bg-duo-green"] {
            background: var(--wl-blue) !important;
        }

        [class~="bg-emerald-500"] {
            background: var(--wl-green) !important;
        }

        [class~="text-red-500"],
        [class~="text-red-400"] {
            color: var(--wl-red) !important;
        }

        [class~="text-amber-500"],
        [class~="text-amber-400"] {
            color: var(--wl-orange) !important;
        }

        [class~="bg-red-500\/10"] {
            background: rgba(255, 59, 48, .10) !important;
        }

        [class~="bg-amber-500\/10"] {
            background: rgba(255, 149, 0, .10) !important;
        }

        /* Keep touch targets comfortable without changing component structure. */
        button {
            -webkit-tap-highlight-color: transparent;
        }

        @media (pointer: coarse) {
            button {
                min-height: 44px;
            }
        }

        /* =========================================================
           Deployment theme normalization
           One coherent surface/label system in both appearances.
           This overrides legacy Tailwind slate tokens without changing structure.
           ========================================================= */
        :root {
            color-scheme: light;
            --wl-light-bg: #f2f2f7;
            --wl-light-surface: #ffffff;
            --wl-light-elevated: #ffffff;
            --wl-light-subtle: #f2f2f7;
            --wl-light-control: #f2f2f7;
            --wl-light-border: rgba(60, 60, 67, .16);
            --wl-light-label: #1d1d1f;
            --wl-light-secondary: #6e6e73;
            --wl-light-tertiary: #8e8e93;
            --wl-dark-bg: #000000;
            --wl-dark-surface: #1c1c1e;
            --wl-dark-elevated: #2c2c2e;
            --wl-dark-subtle: #1c1c1e;
            --wl-dark-control: rgba(118, 118, 128, .18);
            --wl-dark-border: rgba(84, 84, 88, .55);
            --wl-dark-label: #f5f5f7;
            --wl-dark-secondary: #a1a1a6;
            --wl-dark-tertiary: #8e8e93;
        }

        html:not(.dark),
        html:not(.dark) body,
        html:not(.dark) #root {
            background: var(--wl-light-bg) !important;
            color: var(--wl-light-label) !important;
        }

        html.dark {
            color-scheme: dark;
            background: var(--wl-dark-bg) !important;
        }

        html.dark body,
        html.dark #root {
            background: var(--wl-dark-bg) !important;
            color: var(--wl-dark-label) !important;
        }

        /* Neutral surface tokens - light. */
        html:not(.dark) [class~="bg-white"],
        html:not(.dark) [class*="bg-white/"] {
            background-color: var(--wl-light-surface) !important;
        }

        html:not(.dark) [class~="bg-slate-50"],
        html:not(.dark) [class~="bg-slate-100"] {
            background-color: var(--wl-light-subtle) !important;
        }

        html:not(.dark) [class~="bg-slate-200"] {
            background-color: #e5e5ea !important;
        }

        /* Neutral surface tokens - dark. */
        html.dark [class~="bg-white"],
        html.dark [class*="bg-white/"] {
            background-color: var(--wl-dark-surface) !important;
        }

        html.dark [class~="bg-slate-50"],
        html.dark [class~="bg-slate-100"] {
            background-color: var(--wl-dark-subtle) !important;
        }

        html.dark [class~="bg-slate-200"] {
            background-color: var(--wl-dark-control) !important;
        }

        html.dark [class~="bg-slate-700"],
        html.dark [class*="bg-slate-700/"] {
            background-color: var(--wl-dark-elevated) !important;
        }

        html.dark [class~="bg-slate-800"],
        html.dark [class*="bg-slate-800/"] {
            background-color: var(--wl-dark-control) !important;
        }

        html.dark [class~="bg-slate-900"],
        html.dark [class*="bg-slate-900/"] {
            background-color: var(--wl-dark-surface) !important;
        }

        html.dark [class~="bg-slate-950"],
        html.dark [class*="bg-slate-950/"] {
            background-color: var(--wl-dark-bg) !important;
        }

        html.dark [class~="dark:bg-emerald-950/20"],
        html.dark [class~="dark:bg-emerald-950/40"],
        html.dark [class~="dark:bg-emerald-950/60"] {
            background-color: rgba(10, 132, 255, .14) !important;
        }

        /* Text hierarchy - light. */
        html:not(.dark) [class~="text-slate-900"],
        html:not(.dark) [class~="text-slate-800"],
        html:not(.dark) [class~="text-slate-700"] {
            color: var(--wl-light-label) !important;
        }

        html:not(.dark) [class~="text-slate-600"],
        html:not(.dark) [class~="text-slate-500"] {
            color: var(--wl-light-secondary) !important;
        }

        html:not(.dark) [class~="text-slate-400"],
        html:not(.dark) [class~="text-slate-300"] {
            color: var(--wl-light-tertiary) !important;
        }

        /* Text hierarchy - dark. */
        html.dark [class~="text-slate-900"],
        html.dark [class~="text-slate-800"],
        html.dark [class~="text-slate-700"] {
            color: var(--wl-dark-label) !important;
        }

        html.dark [class~="text-slate-600"],
        html.dark [class~="text-slate-500"] {
            color: var(--wl-dark-secondary) !important;
        }

        html.dark [class~="text-slate-400"],
        html.dark [class~="text-slate-300"] {
            color: var(--wl-dark-tertiary) !important;
        }

        html.dark [class~="text-white"] {
            color: var(--wl-dark-label) !important;
        }

        /* Borders / separators - light. */
        html:not(.dark) [class*="border-slate-100"],
        html:not(.dark) [class*="border-slate-200"],
        html:not(.dark) [class*="border-slate-300"] {
            border-color: var(--wl-light-border) !important;
        }

        /* Borders / separators - dark. */
        html.dark [class*="border-slate-100"],
        html.dark [class*="border-slate-200"],
        html.dark [class*="border-slate-300"],
        html.dark [class*="border-slate-700"],
        html.dark [class*="border-slate-800"] {
            border-color: var(--wl-dark-border) !important;
        }

        /* Header and mobile bar must use the same surface family as the page. */
        html:not(.dark) header.sticky {
            background: rgba(255, 255, 255, .82) !important;
            border-bottom-color: var(--wl-light-border) !important;
        }

        html.dark header.sticky {
            background: rgba(28, 28, 30, .82) !important;
            border-bottom-color: var(--wl-dark-border) !important;
        }

        html:not(.dark) .mobile-bottom-nav,
        html:not(.dark) header .md\:hidden {
            background: rgba(255, 255, 255, .92) !important;
            border-top-color: var(--wl-light-border) !important;
        }

        html.dark .mobile-bottom-nav,
        html.dark header .md\:hidden {
            background: rgba(28, 28, 30, .92) !important;
            border-top-color: var(--wl-dark-border) !important;
        }

        /* Inputs, textareas and selects follow the same theme as their surroundings. */
        html:not(.dark) input,
        html:not(.dark) textarea,
        html:not(.dark) select {
            background: #f2f2f7 !important;
            color: var(--wl-light-label) !important;
            border-color: var(--wl-light-border) !important;
        }

        html.dark input,
        html.dark textarea,
        html.dark select {
            background: rgba(118, 118, 128, .16) !important;
            color: var(--wl-dark-label) !important;
            border-color: var(--wl-dark-border) !important;
        }

        html:not(.dark) input::placeholder,
        html:not(.dark) textarea::placeholder {
            color: var(--wl-light-tertiary) !important;
        }

            constructor() {

                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'triangle';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                osc1.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5

                osc2.frequency.setValueAtTime(1046.50, now + 0.2); // C6

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now + 0.2);
                osc1.stop(now + 0.4);
                osc2.stop(now + 0.4);
            }
            playIncorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }
            playFlip() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

                osc.connect(gain);

        function TryoutView({ questions, onFinishTryout }) {

            const [timeLeft, setTimeLeft] = useState(1200); // 20 mins

            };

            const calculateScore = () => {
                let totalEarned = 0;
                let maxPossible = 0;
                let correctCount = 0;
                let incorrectCount = 0;
                let unansweredCount = 0;

                questions.forEach(q => {
                    const weight = parseFloat(q.bobot_nilai || 2.5);
                    maxPossible += weight;

                    if (q.tipe_soal === 'PILGAN') {
                        const selected = answers[q.id_soal];
                        const correctOpt = q.options?.find(o => o.is_jawaban_benar === 1);
                        if (selected === undefined) {
                            unansweredCount++;
                        } else if (selected === correctOpt?.id_opsi) {
                            totalEarned += weight;
                            correctCount++;
                        } else {
                            incorrectCount++;
                        }
                    } else if (q.tipe_soal === 'ESSAY') {
                        const text = essayAnswers[q.id_soal];
                        if (!text || text.trim() === '') {
                            unansweredCount++;
                        } else {
                            totalEarned += weight;
                            correctCount++;
                        }
                    }
                });

                return {
                    earned: totalEarned.toFixed(1),
                    max: maxPossible.toFixed(1),
                    percentage: Math.round((totalEarned / (maxPossible || 1)) * 100),
                    correctCount,
                    incorrectCount,
                    unansweredCount,
                    totalQuestions: questions.length

                                                        <div className="p-3 rounded-xl border bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-400">
                                                            <span className="font-extrabold block text-[10px] uppercase mb-0.5 opacity-80">Correct Answer:</span>
                                                            {correctOpt ? (

        function App() {
            const [darkMode, setDarkMode] = useState(true);
            const [streak, setStreak] = useState(5);
            const [xp, setXp] = useState(120);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [activeSubject, setActiveSubject] = useState(null);
            const [datasets, setDatasets] = useState({});
            const [subjects, setSubjects] = useState([]);
            const [subjectsLoading, setSubjectsLoading] = useState(true);

            // Icon / color palette — assigned round-robin by index (static fallback only)
            const getSubjectMeta = (id, index) => {
                const lower = id.toLowerCase();
                if (lower.includes('w-12 h-12 rounded-2xl flex items-center justify-center bg-emerald-100 dark:bg-emerald-950/80 shadow-smw-12 h-12 rounded-2xl flex items-center justify-center bg-emerald-100 dark:bg-emerald-950/80 shadow-sm') || lower.includes('calc') || lower.includes('algeb') || lower.includes('geom'))
                    return { icon: 'calculator', bgColor: 'bg-emerald-100 dark:bg-emerald-950/80', iconColor: 'text-emerald-600 dark:text-emerald-400' };
                if (lower.includes('mach') || lower.includes('ai') || lower.includes('tech') || lower.includes('robot') || lower.includes('eng'))
                    return { icon: 'cpu', bgColor: 'bg-amber-100 dark:bg-amber-950/80', iconColor: 'text-amber-600 dark:text-amber-400' };
                if (lower.includes('code') || lower.includes('prog') || lower.includes('dev') || lower.includes('comp'))
                    return { icon: 'code-2', bgColor: 'bg-sky-100 dark:bg-sky-950/80', iconColor: 'text-sky-600 dark:text-sky-400' };
                if (lower.includes('phys') || lower.includes('sci'))
                    return { icon: 'atom', bgColor: 'bg-purple-100 dark:bg-purple-950/80', iconColor: 'text-purple-600 dark:text-purple-400' };
                if (lower.includes('bio') || lower.includes('chem'))
                    return { icon: 'flask-conical', bgColor: 'bg-rose-100 dark:bg-rose-950/80', iconColor: 'text-rose-600 dark:text-rose-400' };
                const PALETTE = [
                    { icon: 'book-open', bgColor: 'bg-teal-100 dark:bg-teal-950/80', iconColor: 'text-teal-600 dark:text-teal-400' },
                    { icon: 'layers', bgColor: 'bg-indigo-100 dark:bg-indigo-950/80', iconColor: 'text-indigo-600 dark:text-indigo-400' },
                    { icon: 'globe', bgColor: 'bg-blue-100 dark:bg-blue-950/80', iconColor: 'text-blue-600 dark:text-blue-400' },
                    { icon: 'sparkles', bgColor: 'bg-violet-100 dark:bg-violet-950/80', iconColor: 'text-violet-600 dark:text-violet-400' },
                ];
                return PALETTE[index % PALETTE.length];
            };

            // Convert a filename slug to a readable title
            // e.g. "math" -> "Math", "machine_learning" -> "Machine Learning"
            const slugToTitle = (slug) =>
                slug
                    .replace(/[-_]/g, ' ')
                    .replace(/\b\w/g, c => c.toUpperCase());

            // Fetch a single JSON file directly (static file fallback)
            const fetchSubjectFile = async (filename) => {
                const id = filename.replace(/\.json$/i, '');
                try {
                    const res = await fetch(`questions/${filename}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    return [id, Array.isArray(data) ? data : []];
                } catch (e) {
                    console.warn(`[Golearn] Could not load questions/${filename}:`, e.message);
                    return [id, []];
                }
            };

            // Boot: Try Express /api/subjects first, fall back to static file scanning
            useEffect(() => {
                let cancelled = false;

                const loadSubjects = async () => {
                    setSubjectsLoading(true);

                    // 1. Try Express API
                    try {
                        const apiRes = await fetch('/api/subjects');
                        if (apiRes.ok) {
                            const apiData = await apiRes.json();
                            if (apiData && Array.isArray(apiData.subjects) && apiData.subjects.length > 0) {
                                if (cancelled) return;
                                const newDatasets = {};
                                apiData.subjects.forEach(s => {
                                    newDatasets[s.id] = s.questions || [];
                                });
                                setDatasets(newDatasets);
                                setSubjects(apiData.subjects);
                                setActiveSubject(prev => prev && newDatasets[prev] ? prev : apiData.subjects[0].id);
                                setSubjectsLoading(false);
                                return;
                            }
                        }
                    } catch (_) {
                        // Express API not available (e.g. running as purely static file)
                    }

                    // 2. Static fallback: manifest.json or default files
                    const FALLBACK_FILES = ['math.json', 'machine.json'];
                    let fileList = FALLBACK_FILES;
                    try {
                        const mRes = await fetch('questions/manifest.json');
                        if (mRes.ok) {
                            const mData = await mRes.json();
                            if (Array.isArray(mData) && mData.length > 0) fileList = mData;
                        }
                    } catch (_) { /* use fallback */ }

                    const results = await Promise.all(fileList.map(f => fetchSubjectFile(f)));
                    if (cancelled) return;

                    const newDatasets = {};
                    const newSubjects = [];
                    results.forEach(([id, questions], idx) => {
                        newDatasets[id] = questions;
                        newSubjects.push({
                            id,
                            title: slugToTitle(id),
                            description: `${questions.filter(q => q.tipe_soal === 'PILGAN').length} multiple choice · ${questions.filter(q => q.tipe_soal === 'ESSAY').length} essay`,
                            count: questions.length,
                            ...getSubjectMeta(id, idx),
                        });
                    });

                    setDatasets(newDatasets);
                    setSubjects(newSubjects);
                    setActiveSubject(prev => prev && newDatasets[prev] ? prev : (newSubjects[0]?.id ?? null));
                    setSubjectsLoading(false);
                };

                loadSubjects();
                return () => { cancelled = true; };
            }, []);

            // Derive current questions dynamically based on the selected subject
            const currentQuestions = datasets[activeSubject] || [];

            const handleUploadJson = (newQuestions) => {
                setDatasets(prev => ({
                    ...prev,
                    [activeSubject]: newQuestions
                }));
                // Also refresh count on the subjects list
                setSubjects(prev => prev.map(s =>
                    s.id === activeSubject
                        ? { ...s, count: newQuestions.length, description: `${newQuestions.filter(q => q.tipe_soal === 'PILGAN').length} multiple choice · ${newQuestions.filter(q => q.tipe_soal === 'ESSAY').length} essay` }
                        : s
                ));
            };

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-[#0B0F17] text-slate-900 dark:text-slate-100">
                    <Navbar
                        activeTab={activeTab}
                        setActiveTab={setActiveTab}
                        activeSubject={activeSubject}
                        setActiveSubject={setActiveSubject}
                        subjects={subjects}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                    />

                    <main className="pb-24 md:pb-16">
                        {activeTab === 'dashboard' && (
                            <DashboardView
                                subjects={subjects}
                                activeSubject={activeSubject}
                                setActiveSubject={setActiveSubject}
                                onUploadJson={handleUploadJson}
                                questions={currentQuestions}
                                datasets={datasets}
                                subjectsLoading={subjectsLoading}
                            />
                        )}

                        {activeTab === 'flashcard' && (
                            <FlashcardView questions={currentQuestions} />
                        )}

                        {activeTab === 'tryout' && (
                            <TryoutView questions={currentQuestions} />
                        )}

                        {activeTab === 'speedrun' && (
                            <SpeedRunView questions={currentQuestions} onAddXP={(added) => setXp(prev => prev + added)} />
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
